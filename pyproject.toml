[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-goodmem"
version = "0.2.0"
description = "LangGraph integration for GoodMem: long-term agent memory with semantic storage and retrieval."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["langgraph", "goodmem", "memory", "agents", "llm", "vector-search", "semantic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.10.0,<4.0.0"
dependencies = [
    "langchain-goodmem>=0.2.1,<0.3.0",
    "langgraph>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
agents = ["langchain>=1.0.0,<2.0.0"]

[project.urls]
Homepage = "https://github.com/PAIR-Systems-Inc/goodmem-langgraph"
Repository = "https://github.com/PAIR-Systems-Inc/goodmem-langgraph"
Documentation = "https://docs.goodmem.ai/docs/integrations/agent-frameworks/langgraph/"
Issues = "https://github.com/PAIR-Systems-Inc/goodmem-langgraph/issues"

[dependency-groups]
test = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "langchain>=1.0.0,<2.0.0",
    "langchain-tests==1.1.6",
    "python-dotenv>=1.0.0,<2.0.0",
    "build>=1.0.0,<2.0.0",
]
lint = ["ruff>=0.13.1,<0.14.0"]
typing = [
    "mypy>=1.10.0,<2.0.0",
    "langchain-core",
]

[tool.hatch.build.targets.wheel]
packages = ["langgraph_goodmem"]

[tool.hatch.build.targets.sdist]
only-include = [
    "langgraph_goodmem", "tests", "examples", ".gitignore", "README.md",
    "CHANGELOG.md", "LICENSE", "pyproject.toml", "uv.lock", "Makefile",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "TID251", "UP"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pytest.*"]
ignore_missing_imports = true

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
testpaths = ["tests/unit_tests", "tests/integration_tests"]
markers = [
    "live: tests that create and delete resources on a configured GoodMem server",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "S311",
    "SLF001",
    "D",
    "B018",
    "PGH003",
    "PERF401",
    "PT017",
    "RUF012",
    "B017",
]
"scripts/*.py" = [
    "INP001",
]
